{% extends "base.html" %}

{% block titulo %}SubSolo - Trocar senha{% endblock %}

{% block conteudo %}
    <h1>Trocar senha</h1>
    <p class="descricao">Digite a senha atual e escolha uma nova, com pelo menos 8 caracteres.</p>

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <form method="post">
        <label for="senha_atual">Senha atual</label>
        <input type="password" id="senha_atual" name="senha_atual" autocomplete="current-password" required>

        <label for="senha_nova">Senha nova</label>
        <input type="password" id="senha_nova" name="senha_nova" autocomplete="new-password" minlength="8" required>

        <label for="confirmacao">Confirme a senha nova</label>
        <input type="password" id="confirmacao" name="confirmacao" autocomplete="new-password" minlength="8" required>

        <button type="submit">Salvar nova senha</button>
    </form>
{% endblock %}
