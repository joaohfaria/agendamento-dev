{% extends "base.html" %}

{% block titulo %}SubSolo - Agendamento{% endblock %}

{% block conteudo %}

    [<a href="{{ url_for('logout') }}">Sair</a>]
    <p>Lista de serviços agendados:</p>
    {% for item in agendamentos %}
    <p>{{ item[0] }} - {{ item[3] }} - {{ item[4] }} - {{ item[5] }} - {{ item[6] }}</p>
    {% endfor %}
{% endblock %}
