<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SubSolo</title>
</head>
<body>

    <h1>SubSolo</h1>
    <p>Horario De Funcionamento: Segunda a Sexta, 8h às 18h</p>
    <p>Agende a revisão do seu carro pela internet.</p>
    <h2>Serviços</h2>
    <ul>
    <li>Revisão</li>
    <li>Troca de Óleo</li>
    <li>Alinhamento</li>
    <li>Balanceamento</li>
    </ul>
    <h2>Agendar</h2>
    <form action="/agendar" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <label for ="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required>
        <label for="placa">Placa:</label>
        <input type="text" id="placa" name="placa" required>
        <label for="data">Data:</label>
        <input type="date" id="data" name="data" required>
        <label for="hora">Hora:</label>
        <input type="time" id="hora" name="hora" required>
        <label for="Selecionar Serviço">Selecionar Serviço:</label>
        <select name="servico" id="Selecionar Serviço" required>
            <option value="">Selecione um serviço</option>
            <option value="Revisão">Revisão</option>
            <option value="Troca de Óleo">Troca de Óleo</option>
            <option value="Alinhamento">Alinhamento</option>
            <option value="Balanceamento">Balanceamento</option>
        </select>

        <button type="submit">Agendar</button>
    </form action="/agendar" method="post"></form>  

    <a href="/agendamentos">Ver agendamentos</a>
</body>
</html>
