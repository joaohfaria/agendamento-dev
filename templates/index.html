<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SubSolo</title>
</head>
<body>

    <h1>SubSolo</h1>
    <p>Horario De Funcionamento: Segunda a Sexta, 8h às 18h</p>
    <p>Agende a revisão do seu carro pela internet.</p>
    <h2>Serviços</h2>
    <ul>
    <li>Revisão</li>
    <li>Troca de Óleo</li>
    <li>Alinhamento</li>
    <li>Balanceamento</li>
    </ul>
    <h2>Agendar</h2>
    <form>
        <label for="nome">Nome:</label>
        <input type="text" pessoa="nome" required>
        <label for ="email">Email:</label>
        <input type="email" contato="email" required>
        <label for="telefone">Telefone:</label>
        <input type="tel" numero="telefone" required>
        <label for="Placa">Placa:</label>
        <input type="text" veiculo="Placa">
        
        <button type="submit">Agendar</button>
    </form> 

</body>
</html>
